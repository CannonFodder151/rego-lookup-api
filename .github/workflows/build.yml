name: Build rego-lookup image (multi-arch) + auto-deploy

on:
  push:
    branches: [main]
    paths-ignore:
      # Workflow/doc-only changes (e.g. the weekly security scan) must not
      # rebuild multi-arch images or redeploy both prod stacks (AUT-1019).
      - '.github/**'
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        required: true
        default: hosted
      platforms:
        description: Comma-separated platforms
        required: true
        default: linux/amd64,linux/arm64

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request'
    # AUT-1661: Moved from self-hosted (offline) to GitHub-hosted.
    # Docker buildx + QEMU handles multi-arch — no self-hosted needed.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        if: ${{ github.event.inputs.platforms != 'linux/amd64' }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        env:
          TAG: ${{ github.event.inputs.tag || 'hosted' }}
          PLATFORMS: ${{ github.event.inputs.platforms || 'linux/amd64,linux/arm64' }}
        run: |
          set -euo pipefail
          docker buildx build --platform "${PLATFORMS}" --push \
            -t "ghcr.io/cannonfodder151/rego-lookup:${TAG}" \
            -t "ghcr.io/cannonfodder151/rego-lookup-api:${TAG}" \
            -t "cannonfodder151/rego-lookup-api:${TAG}" \
            -t "cannonfodder151/rego-lookup-api:latest" .

  deploy:
    needs: build
    runs-on: [self-hosted, linux, x64]
    if: ${{ github.event_name == 'push' || github.event.inputs.tag == 'hosted' }}
    steps:
      - name: Auto-redeploy both stacks via Portainer (AUT-264)
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
        run: |
          set -euo pipefail
          BASE="${PORTAINER_URL%/}"
          get_file() {
            # Portainer can briefly 504 while the previous stack is still
            # applying (image pull). Retry up to 10x with backoff.
            local stack_id="$1" endpoint_id="$2" n=0 code sc=""
            while [ "${n}" -lt 10 ]; do
              code="$(curl -sS -o /tmp/sc.json -w '%{http_code}' --max-time 120 \
                -H "X-API-Key: ${PORTAINER_API_KEY}" \
                "${BASE}/api/stacks/${stack_id}/file?endpointId=${endpoint_id}" || true)"
              if [ "${code}" = "200" ]; then
                sc="$(python3 -c 'import json,sys; print(json.load(open("/tmp/sc.json"))["StackFileContent"])')"
                echo "${sc}"
                return 0
              fi
              n=$((n+1))
              echo "get_file ${stack_id} HTTP ${code} (attempt ${n}/10)" >&2
              sleep 10
            done
            echo "::error::could not fetch stack ${stack_id} file (last HTTP ${code})" >&2
            return 1
          }
          redeploy() {
            local stack_id="$1" endpoint_id="$2"
            local sc body code
            sc="$(get_file "${stack_id}" "${endpoint_id}")" || exit 1
            body="$(python3 -c 'import json,sys; print(json.dumps({"StackFileContent": sys.argv[1], "Env": [], "Prune": False, "PullImage": True}))' "$sc")"
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 300 \
              -X PUT -H "X-API-Key: ${PORTAINER_API_KEY}" \
              -H "Content-Type: application/json" --data "$body" \
              "${BASE}/api/stacks/${stack_id}?endpointId=${endpoint_id}" || true)"
            echo "redeploy ${stack_id} on endpoint ${endpoint_id}: HTTP ${code}"
            # PullImage redeploy is async server-side; 504 just means the
            # reverse proxy gave up waiting — Portainer still applies it.
            case "${code}" in
              200|201|202|204) : ;;
              504|000) echo "stack ${stack_id}: update triggered (proxy timeout, Portainer applying)"; ;;
              *) echo "::error::stack ${stack_id} update failed: HTTP ${code}"; exit 1; ;;
            esac
          }
          guard_placeholder() {
            local stack_id="$1" endpoint_id="$2"
            local sc
            sc="$(get_file "${stack_id}" "${endpoint_id}")" || exit 1
            if grep -qE 'API_KEY[=: ]+(<generate-long-random>|change-me[^[:space:]]*)' <<<"${sc}"; then
              echo "::error::stack ${stack_id} still has placeholder API_KEY; refusing deploy (AUT-320)" >&2
              exit 1
            fi
            echo "stack ${stack_id}: API_KEY placeholder check passed"
          }
          guard_placeholder 75 2   # on-prem plate-api-scraper (10.0.3.17:8011)
          guard_placeholder 85 5   # hosted rego-lookup (152.69.188.133:8011)
          redeploy 75 2   # on-prem plate-api-scraper (10.0.3.17:8011)
          redeploy 85 5   # hosted rego-lookup (152.69.188.133:8011)
