name: Build rego-lookup image (multi-arch) + auto-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        required: true
        default: hosted
      platforms:
        description: Comma-separated platforms
        required: true
        default: linux/amd64,linux/arm64

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        if: ${{ github.event.inputs.platforms != 'linux/amd64' }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        env:
          TAG: ${{ github.event.inputs.tag || 'hosted' }}
          PLATFORMS: ${{ github.event.inputs.platforms || 'linux/amd64,linux/arm64' }}
        run: |
          set -euo pipefail
          docker buildx build --platform "${PLATFORMS}" --push \
            -t "ghcr.io/cannonfodder151/rego-lookup:${TAG}" \
            -t "ghcr.io/cannonfodder151/rego-lookup-api:${TAG}" \
            -t "cannonfodder151/rego-lookup-api:${TAG}" \
            -t "cannonfodder151/rego-lookup-api:latest" .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.tag == 'hosted' }}
    steps:
      - name: Auto-redeploy both stacks via Portainer (AUT-264)
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
        run: |
          set -euo pipefail
          BASE="${PORTAINER_URL%/}"
          redeploy() {
            local stack_id="$1" endpoint_id="$2"
            local sc body code
            sc="$(curl -fsS -H "X-API-Key: ${PORTAINER_API_KEY}" \
              "${BASE}/api/stacks/${stack_id}/file?endpointId=${endpoint_id}" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["StackFileContent"])')"
            body="$(python3 -c 'import json,sys; print(json.dumps({"StackFileContent": sys.argv[1], "Env": [], "Prune": False, "PullImage": True}))' "$sc")"
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 300 \
              -X PUT -H "X-API-Key: ${PORTAINER_API_KEY}" \
              -H "Content-Type: application/json" --data "$body" \
              "${BASE}/api/stacks/${stack_id}?endpointId=${endpoint_id}" || true)"
            echo "redeploy ${stack_id} on endpoint ${endpoint_id}: HTTP ${code}"
            # PullImage redeploy is async server-side; 504 just means the
            # reverse proxy gave up waiting — Portainer still applies it.
            case "${code}" in
              200|201|202|204) : ;;
              504|000) echo "stack ${stack_id}: update triggered (proxy timeout, Portainer applying)"; ;;
              *) echo "::error::stack ${stack_id} update failed: HTTP ${code}"; exit 1; ;;
            esac
          }
          redeploy 75 2   # on-prem plate-api-scraper (10.0.3.17:8011)
          redeploy 85 5   # hosted rego-lookup (152.69.188.133:8011)
