# AUT-2224: replace QEMU multi-arch with native per-arch matrix + manifest assembly (AUT-2158 follow-up).
name: Build rego-lookup image (multi-arch) + auto-deploy hosted

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        required: true
        default: hosted
      platforms:
        description: Comma-separated platforms
        required: true
        default: linux/amd64,linux/arm64

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs_on: [self-hosted, linux, x64, vm2]
          - arch: arm64
            runs_on: [self-hosted, linux, ARM64]
    runs-on: ${{ matrix.runs_on }}
    permissions:
      contents: read
      packages: write
    outputs:
      image-amd64: ${{ steps.build.outputs.image-amd64 }}
      image-arm64: ${{ steps.build.outputs.image-arm64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verify runner arch (${{ matrix.arch }})
        run: |
          set -euo pipefail
          want="${{ matrix.arch }}"
          got="$(uname -m)"
          case "$want" in
            amd64) norm="x86_64";;
            arm64) norm="aarch64";;
            *) echo "::error::unknown matrix arch $want"; exit 2;;
          esac
          if [ "$got" != "$norm" ]; then
            echo "::error::runner arch mismatch: want $want (=$norm), got $got"
            exit 1
          fi
          echo "==> runner arch OK: $got ($want)"

      - name: Build and push per-arch image
        id: build
        env:
          TAG: ${{ github.event.inputs.tag || 'hosted' }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          img="ghcr.io/cannonfodder151/rego-lookup-api:${TAG}-${ARCH}"
          echo "==> building ${img} for linux/${ARCH}"
          docker buildx build --platform linux/${ARCH} --push \
            -t "ghcr.io/cannonfodder151/rego-lookup-api:${TAG}-${ARCH}" \
            -t "cannonfodder151/rego-lookup-api:${TAG}-${ARCH}" \
            -f Dockerfile .
          echo "image-${ARCH}=${img}" >> "$GITHUB_OUTPUT"

      - name: Verify pushed image arch (${{ matrix.arch }})
        env:
          TAG: ${{ github.event.inputs.tag || 'hosted' }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          case "$ARCH" in
            amd64) norm="x86_64";;
            arm64) norm="aarch64";;
            *) echo "::error::unknown arch $ARCH"; exit 2;;
          esac
          img="ghcr.io/cannonfodder151/rego-lookup-api:${TAG}-${ARCH}"
          echo "==> verifying $img"
          got="$(docker run --rm --platform linux/${ARCH} "$img" uname -m)"
          if [ "$got" != "$norm" ]; then
            echo "::error::$img reports arch=$got, expected $norm — refusing to assemble manifest"
            exit 1
          fi
          docker run --rm --platform linux/${ARCH} "$img" /bin/sh -c 'true'
          echo "==> ${ARCH} image verified"

  build-manifest:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, x64, vm2]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Gate manifest assembly on per-arch verification
        env:
          TAG: ${{ github.event.inputs.tag || 'hosted' }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            img="ghcr.io/cannonfodder151/rego-lookup-api:${TAG}-${arch}"
            if ! docker buildx imagetools inspect "$img" >/dev/null 2>&1; then
              echo "::error::$img missing — per-arch build for $arch did not publish. Aborting manifest assembly."
              exit 1
            fi
          done

      - name: Assemble multi-arch manifests
        id: digest
        env:
          TAG: ${{ github.event.inputs.tag || 'hosted' }}
          SHA_TAG: hosted-sha-${{ github.sha }}
        run: |
          set -euo pipefail
          echo "==> manifest rego-lookup-api:${TAG}"
          docker buildx imagetools create \
            -t "ghcr.io/cannonfodder151/rego-lookup-api:${TAG}" \
            -t "ghcr.io/cannonfodder151/rego-lookup-api:${SHA_TAG}" \
            "ghcr.io/cannonfodder151/rego-lookup-api:${TAG}-amd64" \
            "ghcr.io/cannonfodder151/rego-lookup-api:${TAG}-arm64"
          d="$(docker buildx imagetools inspect "ghcr.io/cannonfodder151/rego-lookup-api:${TAG}" --raw | head -n1)"
          echo "digest=${d}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [build, build-manifest]
    if: ${{ github.event_name == 'push' || github.event.inputs.tag == 'hosted' }}
    runs-on: [self-hosted, linux, x64, vm2]
    steps:
      - name: Auto-deploy hosted rego-lookup via Portainer (AUT-264, AUT-2409)
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
        run: |
          set -euo pipefail
          BASE="${PORTAINER_URL%/}"
          get_file() {
            local stack_id="$1" endpoint_id="$2" n=0 code sc=""
            while [ "${n}" -lt 10 ]; do
              code="$(curl -sS -o /tmp/sc.json -w '%{http_code}' --max-time 120 \
                -H "X-API-Key: ${PORTAINER_API_KEY}" \
                "${BASE}/api/stacks/${stack_id}/file?endpointId=${endpoint_id}" || true)"
              if [ "${code}" = "200" ]; then
                sc="$(python3 -c 'import json,sys; print(json.load(open("/tmp/sc.json"))["StackFileContent"])')"
                echo "${sc}"
                return 0
              fi
              n=$((n+1))
              echo "get_file ${stack_id} HTTP ${code} (attempt ${n}/10)" >&2
              sleep 10
            done
            echo "::error::could not fetch stack ${stack_id} file (last HTTP ${code})" >&2
            return 1
          }
          redeploy() {
            local stack_id="$1" endpoint_id="$2"
            local sc body code
            sc="$(get_file "${stack_id}" "${endpoint_id}")" || exit 1
            body="$(python3 -c 'import json,sys; print(json.dumps({"StackFileContent": sys.argv[1], "Env": [], "Prune": False, "PullImage": True}))' "$sc")"
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 300 \
              -X PUT -H "X-API-Key: ${PORTAINER_API_KEY}" \
              -H "Content-Type: application/json" --data "$body" \
              "${BASE}/api/stacks/${stack_id}?endpointId=${endpoint_id}" || true)"
            echo "redeploy ${stack_id} on endpoint ${endpoint_id}: HTTP ${code}"
            case "${code}" in
              200|201|202|204) : ;;
              504|000) echo "stack ${stack_id}: update triggered (proxy timeout, Portainer applying)"; ;;
              *) echo "::error::stack ${stack_id} update failed: HTTP ${code}"; exit 1; ;;
            esac
          }
          guard_placeholder() {
            local stack_id="$1" endpoint_id="$2"
            local sc
            sc="$(get_file "${stack_id}" "${endpoint_id}")" || exit 1
            if grep -qE 'API_KEY[=: ]+(<generate-long-random>|change-me[^[:space:]]*)' <<<"${sc}"; then
              echo "::error::stack ${stack_id} still has placeholder API_KEY; refusing deploy (AUT-320)" >&2
              exit 1
            fi
            echo "stack ${stack_id}: API_KEY placeholder check passed"
          }
          guard_placeholder 85 5   # hosted rego-lookup (152.69.188.133:8011)
          redeploy 85 5           # hosted rego-lookup (152.69.188.133:8011)
