name: Build rego-lookup image (multi-arch)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        required: true
        default: hosted
      platforms:
        description: Comma-separated platforms
        required: true
        default: linux/amd64,linux/arm64

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        if: ${{ github.event.inputs.platforms != 'linux/amd64' }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        env:
          TAG: ${{ github.event.inputs.tag }}
          PLATFORMS: ${{ github.event.inputs.platforms }}
        run: |
          set -euo pipefail
          docker buildx build --platform "${PLATFORMS}" --push \
            -t "ghcr.io/cannonfodder151/rego-lookup:${TAG}" \
            -t "ghcr.io/cannonfodder151/rego-lookup-api:${TAG}" \
            -t "cannonfodder151/rego-lookup-api:${TAG}" \
            -t "cannonfodder151/rego-lookup-api:latest" .
