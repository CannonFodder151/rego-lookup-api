# AUT-1798: x64 jobs dispatch to the new vm2 runner (gh-runner-autobrain-rego-2). ARM stays on Oracle VM.
name: Security — full-resolution dependency scan

on:
  schedule:
    # Weekly, Monday 06:00 UTC, same cadence as the autobrain monorepo scan
    # (AUT-1019). A full-resolution (transitive) audit catches CVEs in the
    # resolved tree (playwright/selenium/undetected-chromedriver deps) that a
    # direct-pin review cannot see. Self-hosted runner (private repo: GitHub-
    # hosted minutes are billing-blocked). The runner host's pip traffic is
    # proxied to a stale mirror (uvicorn==0.34.0 missing), so the audit runs
    # inside the deployed image's container: its network reaches live PyPI and
    # its installed site-packages ARE the fully-resolved production tree —
    # no source mount, no resolution, audits exactly what ships (AUT-1019).
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  audit:
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, x64, vm2]
    steps:
      - name: Fail on known vulns in the deployed image
        id: audit
        run: |
          set -euo pipefail
          # docker run would reuse a stale local tag by default; force a fresh
          # pull so the scan audits the deployed image as rebuilt (AUT-1028).
          docker pull cannonfodder151/rego-lookup-api:hosted
          docker run --rm cannonfodder151/rego-lookup-api:hosted \
            sh -c "pip install --quiet pip-audit && pip-audit" \
            || { echo "result=found" >> "$GITHUB_OUTPUT"; exit 1; }
          echo "result=clean" >> "$GITHUB_OUTPUT"

      - name: Report to Discord #status
        if: always()
        env:
          RESULT: ${{ steps.audit.outputs.result }}
          COLOR: ${{ steps.audit.outputs.result == 'clean' && '0x57F287' || '0xED4245' }}
          TITLE: ${{ steps.audit.outputs.result == 'clean' && 'Dependency scan clean' || 'Dependency scan found known CVEs' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST https://n8n.nathanmartina.com/webhook/discord-report \
            -H "Content-Type: application/json" \
            -d "$(jq -nc --arg c status --arg t "$TITLE" --arg col "$COLOR" --arg u "$RUN_URL" \
              '{channel:$c,title:$t,description:"Weekly full-resolution pip-audit of rego-lookup-api requirements.",color:$col,author:"Security Scan",fields:[{name:"Scan",value:"full-resolution (transitive)",inline:true},{name:"Repo",value:"rego-lookup-api",inline:true},{name:"Run",value:$u,inline:true}]}')"
