# AUT-1735: scan the pinned python base image for HIGH/CRITICAL CVEs and
# enforce digest pinning (no floating tags).
#
# Rego's self-hosted runners cannot fetch GitHub-hosted actions
# (actions/checkout, aquasecurity/trivy-action) and GitHub-hosted minutes are
# billing-blocked, so the scan runs trivy directly via `docker run` (the runner
# has Docker + Docker Hub access, proven by the build workflow). The trivy
# vulnerability DB is fetched from ghcr.io at scan time.

name: Security — base image CVE scan (trivy)

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.trivyignore'
      - '.github/workflows/security-scan.yml'
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.trivyignore'
      - '.github/workflows/security-scan.yml'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_BASE_IMAGE: 'python:3.13-slim@sha256:7ce4b6dfe35e55397b7cda544f8a13f191b7ae28dc5aad71fe664dbc9bc2623f'

jobs:
  image-scan:
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Pin guard — python base image must be digest-pinned (AUT-1735)
        run: |
          set -euo pipefail
          # Fetch the in-repo Dockerfile (no checkout action on rego runners).
          DOCKERFILE="$(curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/Dockerfile" || true)"
          FLOATING="$(printf '%s\n' "$DOCKERFILE" | grep -nE 'FROM python:[0-9]' || true)"
          FLOATING="$(printf '%s\n' "$FLOATING" | grep -v '@sha256' || true)"
          if [ -n "$FLOATING" ]; then
            echo "::error::floating python base image detected (missing @sha256 digest):"
            printf '%s\n' "$FLOATING"
            exit 1
          fi
          echo "OK: python base image is digest-pinned in Dockerfile."

      - name: Scan pinned python base image (HIGH/CRITICAL, AUT-1735)
        run: |
          set -euo pipefail
          docker pull aquasec/trivy:latest
          docker run --rm aquasec/trivy:latest image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            "$PYTHON_BASE_IMAGE" | tee trivy-python-report.txt

      - name: Report to Discord #status
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            COLOR=0x57F287; TITLE="Base image scan clean"
          else
            COLOR=0xED4245; TITLE="Base image scan found HIGH/CRITICAL CVEs"
          fi
          curl -s -X POST https://n8n.nathanmartina.com/webhook/discord-report \
            -H "Content-Type: application/json" \
            -d "{\"channel\":\"status\",\"title\":\"$TITLE\",\"description\":\"trivy scan of digest-pinned python:3.13-slim base image (rego-lookup-api).\",\"color\":\"$COLOR\",\"author\":\"Security Scan\",\"fields\":[{\"name\":\"Image\",\"value\":\"python:3.13-slim\",\"inline\":true},{\"name\":\"Run\",\"value\":\"$RUN_URL\",\"inline\":true}]}"

  audit:
    # Full-resolution pip-audit of the *deployed* image. Only meaningful on
    # main/schedule (the `:hosted` tag is published by auto-deploy), so it is
    # intentionally skipped on pull_request where that image does not exist.
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Fail on known vulns in the deployed image
        id: audit
        run: |
          set -euo pipefail
          docker pull cannonfodder151/rego-lookup-api:hosted
          docker run --rm cannonfodder151/rego-lookup-api:hosted \
            sh -c "pip install --quiet pip-audit && pip-audit" \
            || { echo "result=found" >> "$GITHUB_OUTPUT"; exit 1; }
          echo "result=clean" >> "$GITHUB_OUTPUT"

      - name: Report to Discord #status
        if: always()
        env:
          RESULT: ${{ steps.audit.outputs.result }}
          COLOR: ${{ steps.audit.outputs.result == 'clean' && '0x57F287' || '0xED4245' }}
          TITLE: ${{ steps.audit.outputs.result == 'clean' && 'Dependency scan clean' || 'Dependency scan found known CVEs' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST https://n8n.nathanmartina.com/webhook/discord-report \
            -H "Content-Type: application/json" \
            -d "$(jq -nc --arg c status --arg t "$TITLE" --arg col "$COLOR" --arg u "$RUN_URL" \
              '{channel:$c,title:$t,description:"Weekly full-resolution pip-audit of rego-lookup-api requirements.",color:$col,author:"Security Scan",fields:[{name:"Scan",value:"full-resolution (transitive)",inline:true},{name:"Repo",value:"rego-lookup-api",inline:true},{name:"Run",value:$u,inline:true}]}')"
