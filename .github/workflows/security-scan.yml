# AUT-1735: scan the pinned python base image for HIGH/CRITICAL CVEs and
# enforce digest pinning (no floating tags).
#
# Note: AUT-1781 and related fixes (vm2 runner instability) led to using
# GitHub-hosted runners for reliable action fetching. The `x64` self-hosted
# label maps to broken vm2 runners; ubuntu-latest has full internet access.
# The pin-guard and trivy scan steps run on GitHub-hosted; the `audit` job
# (detecting unfixed vulns in the DEPLOYED image) stays on self-hosted.

name: Security — base image CVE scan (trivy)

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.trivyignore'
      - '.github/workflows/security-scan.yml'
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.trivyignore'
      - '.github/workflows/security-scan.yml'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_BASE_IMAGE: 'python:3.13-slim@sha256:7ce4b6dfe35e55397b7cda544f8a13f191b7ae28dc5aad71fe664dbc9bc2623f'

jobs:
  image-scan:
    # GitHub-hosted runner to ensure actions can be downloaded (self-hosted
    # runners had network issues fetching actions/checkout and trivy-action).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pin guard — python base image must be digest-pinned (AUT-1735)
        run: |
          set -euo pipefail
          FLOATING="$(grep -nE 'FROM python:[0-9]' Dockerfile || true)"
          FLOATING="$(printf '%s\n' "$FLOATING" | grep -v '@sha256' || true)"
          if [ -n "$FLOATING" ]; then
            echo "::error::floating python base image detected (missing @sha256 digest):"
            printf '%s\n' "$FLOATING"
            exit 1
          fi
          echo "OK: python base image is digest-pinned in Dockerfile."

      - name: Scan pinned python base image (HIGH/CRITICAL, AUT-1735)
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ${{ env.PYTHON_BASE_IMAGE }}
          scanner: vuln
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          format: 'table'
          output: 'trivy-python-report.txt'
          exit-code: '1'

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-python-report
          path: |
            trivy-python-report.txt

      - name: Report to Discord #status
        if: always()
        env:
          COLOR: ${{ job.status == 'success' && '0x57F287' || '0xED4245' }}
          TITLE: ${{ job.status == 'success' && 'Base image scan clean' || 'Base image scan found HIGH/CRITICAL CVEs' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST https://n8n.nathanmartina.com/webhook/discord-report \
            -H "Content-Type: application/json" \
            -d "$(jq -nc --arg c status --arg t "$TITLE" --arg col "$COLOR" --arg u "$RUN_URL" \
              '{channel:$c,title:$t,description:"trivy scan of digest-pinned python:3.13-slim base image (rego-lookup-api).",color:$col,author:"Security Scan",fields:[{name:"Image",value:"python:3.13-slim",inline:true},{name:"Run",value:$u,inline:true}]}')"

  audit:
    # Full-resolution pip-audit of the *deployed* image. Only meaningful on
    # main/schedule (the `:hosted` tag is published by auto-deploy), so it is
    # intentionally skipped on pull_request where that image does not exist.
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Fail on known vulns in the deployed image
        id: audit
        run: |
          set -euo pipefail
          docker pull cannonfodder151/rego-lookup-api:hosted
          docker run --rm cannonfodder151/rego-lookup-api:hosted \
            sh -c "pip install --quiet pip-audit && pip-audit" \
            || { echo "result=found" >> "$GITHUB_OUTPUT"; exit 1; }
          echo "result=clean" >> "$GITHUB_OUTPUT"

      - name: Report to Discord #status
        if: always()
        env:
          RESULT: ${{ steps.audit.outputs.result }}
          COLOR: ${{ steps.audit.outputs.result == 'clean' && '0x57F287' || '0xED4245' }}
          TITLE: ${{ steps.audit.outputs.result == 'clean' && 'Dependency scan clean' || 'Dependency scan found known CVEs' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST https://n8n.nathanmartina.com/webhook/discord-report \
            -H "Content-Type: application/json" \
            -d "$(jq -nc --arg c status --arg t "$TITLE" --arg col "$COLOR" --arg u "$RUN_URL" \
              '{channel:$c,title:$t,description:"Weekly full-resolution pip-audit of rego-lookup-api requirements.",color:$col,author:"Security Scan",fields:[{name:"Scan",value:"full-resolution (transitive)",inline:true},{name:"Repo",value:"rego-lookup-api",inline:true},{name:"Run",value:$u,inline:true}]}')"