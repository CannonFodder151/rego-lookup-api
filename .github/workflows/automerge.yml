name: automerge

# AUT-5654: runs on the self-hosted runner (gh-runner-autobrain-rego, online
# and idle) instead of a GitHub-hosted one. This repo is private and the
# account's hosted-runner spending limit is exhausted, so an ubuntu-latest job
# fails in 3-6 seconds with zero steps and no log — the only evidence is the
# check-run annotation "The job was not started because recent account
# payments have failed or your spending limit needs to be increased". That
# silently broke the auto-merge pipeline (AUT-2230). The pull_request trigger
# runs the workflow file from the PR head, so this is the same trust
# consideration as the website repo's equivalent job, where Security review is
# recorded on AUT-5654.
#
# AUT-6457: replaced gh CLI with curl REST calls — gh is not installed on the
# self-hosted runner, causing exit code 127 (command not found).
on:
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [ready_for_review]
  issue_comment:
    types: [created]
  check_run:
    types: [completed]
  status:

permissions:
  contents: write
  pull-requests: read
  issues: read
  checks: read
  statuses: read

jobs:
  automerge:
    if: github.event_name != 'check_run' || github.event.check_run.name != 'automerge'
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Resolve pull request
        id: pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PULL_REQUEST: ${{ github.event.pull_request.number }}
          EVENT_COMMENT_ON_PR: ${{ github.event.issue.pull_request.url }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          REPO="${{ github.repository }}"
          PR=""
          case "$EVENT_NAME" in
            issue_comment)
              if [ -n "$EVENT_COMMENT_ON_PR" ]; then PR="${{ github.event.issue.number }}"; fi
              ;;
            pull_request_review|pull_request)
              PR="$EVENT_PULL_REQUEST"
              ;;
            *)
              PR="$(curl -sf -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/commits/$EVENT_SHA/pulls" | jq -r '.[0].number // empty' || true)"
              ;;
          esac
          echo "pr=$PR" >> "$GITHUB_OUTPUT"

      - name: Squash-merge approved PR
        if: steps.pr.outputs.pr != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          REPO="${{ github.repository }}"
          PR="${{ steps.pr.outputs.pr }}"
          API="https://api.github.com/repos/$REPO"
          AUTH="Authorization: Bearer $GITHUB_TOKEN"
          ACCEPT="Accept: application/vnd.github+json"

          DEFAULT="$(curl -sf -H "$AUTH" -H "$ACCEPT" "$API" | jq -r '.default_branch')"
          DATA="$(curl -sf -H "$AUTH" -H "$ACCEPT" "$API/pulls/$PR")"

          BASE="$(echo "$DATA" | jq -r '.base.ref')"
          if [ "$BASE" != "$DEFAULT" ]; then echo "skip: base '$BASE' is not '$DEFAULT'"; exit 0; fi
          if [ "$(echo "$DATA" | jq '.draft')" = "true" ]; then echo "skip: draft PR"; exit 0; fi
          STATE="$(echo "$DATA" | jq -r '.mergeable_state')"
          if [ "$STATE" != "clean" ]; then echo "skip: mergeable_state=$STATE"; exit 0; fi

          HEAD_SHA="$(echo "$DATA" | jq -r '.head.sha')"
          HEAD_REF="$(echo "$DATA" | jq -r '.head.ref')"
          CMP="$(curl -sf -H "$AUTH" -H "$ACCEPT" "$API/compare/$DEFAULT...$HEAD_SHA" | jq -c '[.status, .ahead_by, .behind_by]')"
          C_STATUS="$(echo "$CMP" | jq -r '.[0]')"
          C_AHEAD="$(echo "$CMP" | jq -r '.[1]')"
          C_BEHIND="$(echo "$CMP" | jq -r '.[2]')"
          if [ "$C_STATUS" != "ahead" ]; then
            echo "skip: head $HEAD_SHA is not based on current $DEFAULT (compare status=$C_STATUS ahead_by=$C_AHEAD behind_by=$C_BEHIND) — merge $DEFAULT into the head branch first"
            exit 0
          fi

          echo "approve: PR meets merge criteria (clean, up-to-date, checks green)"

          if echo "$DATA" | jq -e '[.labels[].name] | index("hold") != null' >/dev/null; then echo "skip: 'hold' label set"; exit 0; fi

          ROLLUP="$(echo "$DATA" | jq '[.statusCheckRollup[]?.conclusion] | all(. == "SUCCESS" or . == "SKIPPED" or . == "NEUTRAL")')"
          if [ "$ROLLUP" != "true" ]; then echo "skip: status checks not green"; exit 0; fi

          MERGE_RESP="$(curl -sf -X PUT -H "$AUTH" -H "$ACCEPT" -H "Content-Type: application/json" "$API/pulls/$PR/merge" -d "{\"merge_method\":\"squash\",\"sha\":\"$HEAD_SHA\"}" || true)"
          if echo "$MERGE_RESP" | jq -e '.merged' >/dev/null 2>&1; then
            echo "merged: $(echo "$MERGE_RESP" | jq -r '.message // "success"')"
            curl -sf -X DELETE -H "$AUTH" -H "$ACCEPT" "$API/git/refs/heads/$HEAD_REF" || echo "branch delete skipped (may already be gone)"
          else
            echo "merge not performed: $(echo "$MERGE_RESP" | jq -r '.message // "unknown error"')"
          fi
