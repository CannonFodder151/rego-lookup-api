name: VIC motorcycle smoke
on:
  workflow_dispatch:

jobs:
  vic-motorcycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb
          python -m pip install -q selenium beautifulsoup4 undetected-chromedriver setuptools
      - name: lookup FZR60 VIC motorcycle
        run: |
          xvfb-run -a python uc_worker.py FZR60 VIC motorcycle
