name: VIC motorcycle smoke
on:
  workflow_dispatch:

jobs:
  vic-motorcycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb unzip
          python -m pip install -q selenium beautifulsoup4 undetected-chromedriver setuptools
      - name: chromedriver
        run: |
          VER=$(/usr/bin/google-chrome --version | grep -oP '\d+\.\d+\.\d+\.\d+')
          wget -q "https://storage.googleapis.com/chrome-for-testing-public/${VER}/linux64/chromedriver-linux64.zip"
          unzip -q -o chromedriver-linux64.zip
          mkdir -p "$HOME/.local/bin"
          cp chromedriver-linux64/chromedriver "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/chromedriver" --version
      - name: lookup FZR60 VIC motorcycle
        run: |
          echo "chrome: $(/usr/bin/google-chrome --version)"
          echo "driver: $(chromedriver --version)"
          timeout 150 xvfb-run -a python -u diag_vic2.py
          echo "=== full worker ==="
          timeout 150 xvfb-run -a python -u uc_worker.py FZR60 VIC motorcycle
      - name: upload diag
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vic-diag2
          path: poll*.png
